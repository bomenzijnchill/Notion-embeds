<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background: #191919;
    color: #F0EBE3;
    font-family: 'Manrope', sans-serif;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 12px;
  }

  .card {
    width: fit-content;
    max-width: 100%;
    background: #1C1813;
    border: 1px solid rgba(240, 235, 227, 0.08);
    border-radius: 14px;
    padding: 32px 40px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 34px;
    box-shadow: 0 1px 0 rgba(26, 24, 20, 0.02);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: #B8533F;
  }

  .week-block {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1;
  }

  .week-label {
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #B8533F;
    margin-bottom: 14px;
  }

  .week-number {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 92px;
    letter-spacing: -0.04em;
    line-height: 0.85;
    font-variation-settings: "opsz" 144;
    color: #F0EBE3;
  }

  .divider {
    width: 1px;
    align-self: stretch;
    background: rgba(240, 235, 227, 0.1);
    margin: 8px 0;
  }

  .date-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .weekday {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 27px;
    font-style: italic;
    line-height: 1;
    color: #F0EBE3;
    font-variation-settings: "opsz" 48;
  }

  .full-date {
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: #B8AE9D;
    letter-spacing: 0.01em;
  }

  .meta {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8A8273;
  }

  .meta-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #B8533F;
  }

  @media (max-width: 440px) {
    body { padding: 10px; }
    .card {
      padding: 24px 26px;
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
    }
    .divider { display: none; }
    .week-number { font-size: 76px; }
    .weekday { font-size: 24px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="week-block">
      <span class="week-label">Week</span>
      <span class="week-number" id="weekNumber">22</span>
    </div>
    <div class="divider"></div>
    <div class="date-block">
      <span class="weekday" id="weekday">dinsdag</span>
      <span class="full-date" id="fullDate">26 mei 2026</span>
      <div class="meta">
        <span class="meta-dot"></span>
        <span id="yearMeta">2026</span>
      </div>
    </div>
  </div>

<script>
  function getISOWeek(date) {
    const target = new Date(date.valueOf());
    const dayNr = (date.getDay() + 6) % 7;
    target.setDate(target.getDate() - dayNr + 3);
    const firstThursday = target.valueOf();
    target.setMonth(0, 1);
    if (target.getDay() !== 4) {
      target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
    }
    return 1 + Math.ceil((firstThursday - target) / 604800000);
  }

  const weekdays = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
  const months = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];

  function updateWidget() {
    const now = new Date();
    const week = getISOWeek(now);
    const weekday = weekdays[now.getDay()];
    const day = now.getDate();
    const month = months[now.getMonth()];
    const year = now.getFullYear();

    document.getElementById('weekNumber').textContent = week;
    document.getElementById('weekday').textContent = weekday;
    document.getElementById('fullDate').textContent = `${day} ${month} ${year}`;
    document.getElementById('yearMeta').textContent = year;
  }

  updateWidget();
  // Elke minuut updaten zodat het rond middernacht automatisch wisselt
  setInterval(updateWidget, 60000);
</script>
</body>
</html>
