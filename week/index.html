<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background: #191919;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
      sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 8px;
  }

  .callout {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: fit-content;
    max-width: 100%;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(255, 255, 255, 0.055);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .callout-icon {
    font-size: 20px;
    line-height: 1.5;
    flex-shrink: 0;
  }

  .callout-content {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .callout-title {
    display: flex;
    align-items: baseline;
    gap: 7px;
  }

  .wk-label {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.81);
  }

  #weekNumber {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    color: rgba(255, 255, 255, 0.92);
  }

  .callout-sub {
    font-size: 14px;
    font-weight: 400;
    line-height: 1.5;
    color: rgba(255, 255, 255, 0.46);
    margin-top: 1px;
  }
</style>
</head>
<body>
  <div class="callout">
    <span class="callout-icon">🗓️</span>
    <div class="callout-content">
      <span class="callout-title"><span class="wk-label">Week</span><span id="weekNumber">22</span></span>
      <span class="callout-sub" id="fullDate">dinsdag 26 mei 2026</span>
    </div>
  </div>

<script>
  function getISOWeek(date) {
    const target = new Date(date.valueOf());
    const dayNr = (date.getDay() + 6) % 7;
    target.setDate(target.getDate() - dayNr + 3);
    const firstThursday = target.valueOf();
    target.setMonth(0, 1);
    if (target.getDay() !== 4) {
      target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
    }
    return 1 + Math.ceil((firstThursday - target) / 604800000);
  }

  const weekdays = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
  const months = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus', 'september', 'oktober', 'november', 'december'];

  function updateWidget() {
    const now = new Date();
    const week = getISOWeek(now);
    const weekday = weekdays[now.getDay()];
    const day = now.getDate();
    const month = months[now.getMonth()];
    const year = now.getFullYear();

    document.getElementById('weekNumber').textContent = week;
    document.getElementById('fullDate').textContent = `${weekday} ${day} ${month} ${year}`;
  }

  updateWidget();
  // Elke minuut updaten zodat het rond middernacht automatisch wisselt
  setInterval(updateWidget, 60000);
</script>
</body>
</html>
